[workspace]
resolver = "2"
members = ["bins/unhappy-listener"]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "MIT"
publish = false

# One set of lints for every crate; check.sh denies warnings.
[workspace.lints.rust]
unused_qualifications = "warn"

# A small daemon: one unit, linked whole, aborts on panic and lets systemd restart it.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
